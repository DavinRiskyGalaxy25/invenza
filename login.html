<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login — Invenza</title>
  <meta name="theme-color" content="#37A5FF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Invenza">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-page-pattern"></div>
    <div class="auth-card">
      <div class="auth-brand">
        <img src="assets/icons/icon-192.png" alt="Logo Invenza">
        <div class="brand-name">Invenza</div>
        <div class="brand-sub">For NexByte Game Store</div>
      </div>

      <div class="auth-title">
        <h1>Selamat Datang Kembali</h1>
        <p>Login untuk mengelola data inventaris Anda.</p>
      </div>

      <div id="login-alert" class="auth-alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="Masukkan email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="login-password" class="form-control" placeholder="Masukkan password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" data-target="login-password"><i class="bi bi-eye"></i></button>
          </div>
        </div>

        <button type="submit" id="login-submit" class="btn btn-primary btn-block">LOGIN</button>
      </form>

      <div class="auth-links">
        <a href="reset-password.html" class="forgot-link">Lupa Password?</a>
        <span class="switch-link">Belum punya akun? <a href="signup.html">Daftar</a></span>
      </div>

      <div style="margin-top:16px;text-align:center;">
        <button id="install-pwa-login-btn" data-pwa-install="auth" class="btn btn-secondary btn-sm" type="button" style="border-radius:20px;font-size:12.5px;padding:6px 16px;">
          <i class="bi bi-download pwa-icon"></i> <span class="pwa-label">Install Invenza</span>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
