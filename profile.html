<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profil Saya — Invenza</title>
  <meta name="theme-color" content="#37A5FF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Invenza">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <div class="app-shell">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="assets/icons/icon-192.png" alt="Invenza" style="width:30px;height:30px;border-radius:8px;">
        Invenza
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="products.html"><i class="bi bi-box-seam"></i> Data Barang</a>
        <a href="about.html"><i class="bi bi-info-circle"></i> About</a>
        <a href="import.html"><i class="bi bi-cloud-arrow-up"></i> Import Data</a>
        <a href="download.html"><i class="bi bi-download"></i> Download Data</a>
        <a href="profile.html" class="active"><i class="bi bi-person-circle"></i> Profil Saya</a>
      </nav>
      <div class="sidebar-footer">
        <button id="install-pwa-nav-btn" data-pwa-install="sidebar" class="btn btn-secondary btn-block sidebar-pwa-btn" type="button">
          <i class="bi bi-download pwa-icon"></i>
          <span class="pwa-label">Install Invenza</span>
        </button>
        <button id="logout-btn" class="btn btn-secondary btn-block"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button id="menu-toggle" class="menu-toggle"><i class="bi bi-list"></i></button>
          <div class="topbar-title">Profil Saya</div>
        </div>
        <div class="topbar-right">
          <button id="install-pwa-topbar-btn" data-pwa-install="topbar" class="btn btn-primary topbar-install-btn" type="button" aria-label="Install Invenza">
            <i class="bi bi-download pwa-icon"></i><span class="pwa-label">Install</span>
          </button>
          <div class="topbar-user">
            <div class="user-avatar" id="navbar-user-avatar">U</div>
            <span id="navbar-user-name">Pengguna</span>
          </div>
        </div>
      </header>

      <main class="page-body">

        <div class="profile-hero">
          <div class="profile-hero-avatar" id="profile-avatar-hero">U</div>
          <div>
            <h2 id="profile-name-hero">Pengguna</h2>
            <p id="profile-email-hero">-</p>
          </div>
          <div class="profile-hero-actions">
            <button id="open-edit-profile-btn" class="btn btn-secondary"><i class="bi bi-pencil-square"></i> Edit Profile</button>
            <button id="open-change-password-btn" class="btn btn-secondary"><i class="bi bi-key"></i> Ganti Password</button>
          </div>
        </div>

        <div class="profile-grid">
          <div class="card">
            <div class="card-header"><h3>Informasi Akun</h3></div>
            <div class="card-body">
              <div class="info-list">
                <div class="info-row">
                  <i class="bi bi-person"></i>
                  <div>
                    <div class="info-row-label">Username</div>
                    <div class="info-row-value" id="info-username">-</div>
                  </div>
                </div>
                <div class="info-row">
                  <i class="bi bi-envelope"></i>
                  <div>
                    <div class="info-row-label">Email</div>
                    <div class="info-row-value" id="info-email">-</div>
                  </div>
                </div>
                <div class="info-row">
                  <i class="bi bi-calendar3"></i>
                  <div>
                    <div class="info-row-label">Bergabung Sejak</div>
                    <div class="info-row-value" id="info-joined">-</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </main>
      <footer class="app-footer">
        &copy; 2026 Invenza &middot; Developed by <strong>Nexora</strong>
      </footer>
    </div>
  </div>

  <!-- ============ MODAL: Edit Profile ============ -->
  <div id="edit-profile-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Edit Profile</h3>
        <button class="btn-icon" data-close-modal aria-label="Tutup"><i class="bi bi-x-lg"></i></button>
      </div>
      <form id="edit-profile-form" novalidate>
        <div class="modal-body">

          <div class="avatar-picker">
            <div class="avatar-picker-preview" id="avatar-picker-preview">U</div>
            <input type="file" id="avatar-file-input" accept="image/png, image/jpeg, image/webp" class="hidden">
            <div class="avatar-picker-actions">
              <button type="button" id="change-photo-btn" class="btn btn-secondary btn-sm"><i class="bi bi-camera"></i> Change Photo</button>
              <button type="button" id="remove-photo-btn" class="btn btn-ghost btn-sm"><i class="bi bi-trash"></i> Hapus Foto</button>
            </div>
            <div class="form-error" id="error-avatar"></div>
          </div>

          <div class="form-group">
            <label for="edit-username">Username</label>
            <input type="text" id="edit-username" class="form-control" placeholder="username" maxlength="30" autocomplete="off">
            <div class="form-error" id="error-username"></div>
          </div>

          <div class="form-group">
            <label for="edit-email">Email</label>
            <input type="email" id="edit-email" class="form-control" placeholder="nama@email.com" autocomplete="off">
            <div class="form-error" id="error-email"></div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
          <button type="submit" id="edit-profile-submit-btn" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ MODAL: Change Password ============ -->
  <div id="change-password-modal" class="modal-overlay hidden">
    <div class="modal-box modal-sm">
      <div class="modal-header">
        <h3>Ganti Password</h3>
        <button class="btn-icon" data-close-modal aria-label="Tutup"><i class="bi bi-x-lg"></i></button>
      </div>
      <form id="change-password-form" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label for="new-password">Password Baru</label>
            <div class="password-wrap">
              <input type="password" id="new-password" class="form-control" placeholder="Minimal 6 karakter" autocomplete="new-password">
              <button type="button" class="toggle-password" data-target="new-password" aria-label="Tampilkan password"><i class="bi bi-eye"></i></button>
            </div>
            <div class="form-error" id="error-new-password"></div>
          </div>
          <div class="form-group">
            <label for="confirm-new-password">Konfirmasi Password Baru</label>
            <div class="password-wrap">
              <input type="password" id="confirm-new-password" class="form-control" placeholder="Ulangi password baru" autocomplete="new-password">
              <button type="button" class="toggle-password" data-target="confirm-new-password" aria-label="Tampilkan password"><i class="bi bi-eye"></i></button>
            </div>
            <div class="form-error" id="error-confirm-password"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
          <button type="submit" id="change-password-submit-btn" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
