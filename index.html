<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Invenza — NexByte Game Store Inventory</title>
  <meta name="description" content="Invenza — Inventory management system for NexByte Game Store.">
  <meta name="theme-color" content="#38BDF8">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Invenza">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- ============ SPLASH SCREEN ============ -->
  <div id="splash-screen">
    <img src="assets/icons/icon-192.png" alt="Invenza Logo" class="splash-logo">
    <div class="splash-name">Invenza</div>
    <div class="splash-tagline">NexByte Game Store — Inventory System</div>
    <div class="splash-loader"></div>
    <div class="splash-dev">Designed &amp; Engineered by Nexora</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script>
    const MIN_SPLASH_MS = 1400;
    const startTime = Date.now();

    async function routeAfterSplash() {
      let destination = "login.html";
      try {
        const { data } = await supabaseClient.auth.getSession();
        if (data && data.session) {
          destination = "dashboard.html";
        }
      } catch (err) {
        console.warn("Failed to check auth session:", err);
      }

      const elapsed = Date.now() - startTime;
      const remaining = Math.max(MIN_SPLASH_MS - elapsed, 0);

      setTimeout(() => {
        const splash = document.getElementById("splash-screen");
        if (splash) splash.classList.add("fade-out");
        setTimeout(() => {
          window.location.replace(destination);
        }, 350);
      }, remaining);
    }

    routeAfterSplash();
  </script>
</body>
</html>
