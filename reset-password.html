<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password — Invenza</title>
  <meta name="theme-color" content="#37A5FF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Invenza">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-page-pattern"></div>
    <div class="auth-card">
      <div class="auth-brand">
        <img src="assets/icons/icon-192.png" alt="Logo Invenza">
        <div class="brand-name">Invenza</div>
        <div class="brand-sub">For NexByte Game Store</div>
      </div>

      <!-- ============ MODE 1: Request reset link ============ -->
      <div id="request-section">
        <div class="auth-title">
          <h1>Lupa Password</h1>
          <p>Masukkan email Anda, kami akan mengirimkan link reset password.</p>
        </div>

        <div id="request-alert" class="auth-alert"></div>

        <form id="request-form" novalidate>
          <div class="form-group">
            <label for="reset-email">Email</label>
            <input type="email" id="reset-email" class="form-control" placeholder="Masukkan email" autocomplete="email" required>
          </div>
          <button type="submit" id="request-submit" class="btn btn-primary btn-block">KIRIM LINK RESET</button>
        </form>

        <div class="auth-links">
          <span class="switch-link">Ingat password Anda? <a href="login.html">Login</a></span>
        </div>
      </div>

      <!-- ============ MODE 2: Set new password (dari link email) ============ -->
      <div id="update-section" class="hidden">
        <div class="auth-title">
          <h1>Buat Password Baru</h1>
          <p>Masukkan password baru untuk akun Anda.</p>
        </div>

        <div id="update-alert" class="auth-alert"></div>

        <form id="update-form" novalidate>
          <div class="form-group">
            <label for="new-password">Password Baru</label>
            <div class="password-wrap">
              <input type="password" id="new-password" class="form-control" placeholder="Password baru" autocomplete="new-password" required>
              <button type="button" class="toggle-password" data-target="new-password"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          <div class="form-group">
            <label for="confirm-new-password">Konfirmasi Password Baru</label>
            <div class="password-wrap">
              <input type="password" id="confirm-new-password" class="form-control" placeholder="Ulangi password baru" autocomplete="new-password" required>
              <button type="button" class="toggle-password" data-target="confirm-new-password"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          <button type="submit" id="update-submit" class="btn btn-primary btn-block">SIMPAN PASSWORD</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
